name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          # The declared minimum. composer.json pins config.platform to 8.1 so
          # the lock resolves for it too.
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - run: composer validate --strict
      - run: composer install --prefer-dist --no-progress
      - name: Coding standards
        run: composer lint
      - name: PHPStan (level 9)
        run: composer phpstan

      - name: Version consistency
        run: |
          set -euo pipefail
          header=$(grep -m1 '^ \* Version:' arkid-catalogue-link.php | awk '{print $3}')
          const=$(grep -m1 "ARKID_CATALOGUE_LINK_VERSION  =" arkid-catalogue-link.php | sed "s/.*'\(.*\)'.*/\1/")
          pkg=$(node -p "require('./package.json').version")
          block=$(node -p "require('./src/blocks/embed/block.json').version")
          stable=$(grep -m1 '^Stable tag:' readme.txt | awk '{print $3}')
          echo "header=$header const=$const package=$pkg block=$block stable=$stable"
          # Stable tag must equal Version: WordPress.org serves whatever Stable
          # tag points at, so a mismatch ships the wrong code.
          for v in "$const" "$pkg" "$block" "$stable"; do
            [ "$v" = "$header" ] || { echo "::error::version mismatch: $v != $header"; exit 1; }
          done

  unit:
    name: Unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-progress
      - run: composer test

  integration:
    name: Integration (WP ${{ matrix.wp }} / WC ${{ matrix.wc }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The Woo Marketplace requires support for the latest TWO majors of
        # both, so 7.1/7.0 and 11.0/10.9 are covered on the diagonal. The 6.9
        # leg is ours, not theirs: it is the `Requires at least` the plugin
        # declares, and nothing else here would exercise it.
        #
        # Bump the 7.x legs whenever readme.txt's "Tested up to" moves —
        # WordPress.org's weekly Plugin Check gate forces that header forward
        # the week a major ships, and the header is a compatibility claim this
        # matrix is what backs.
        include:
          - { wp: '7.1', wc: '11.0', php: '8.4' }
          - { wp: '7.1', wc: '10.9', php: '8.3' }
          - { wp: '7.0', wc: '11.0', php: '8.2' }
          - { wp: '6.9', wc: '10.9', php: '8.1' }
          - { wp: 'nightly', wc: 'latest', php: '8.4', experimental: true }
    continue-on-error: ${{ matrix.experimental || false }}
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          # WordPress talks to MariaDB through mysqli; without it every job here
          # dies inside the test bootstrap instead of at setup.
          extensions: mysqli
          tools: composer:v2, wp-cli

      - run: composer install --prefer-dist --no-progress

      - name: Provision WordPress ${{ matrix.wp }} + WooCommerce ${{ matrix.wc }}
        env:
          WP_TESTS_DB_HOST: 127.0.0.1
          MARIADB_ROOT_PASSWORD: wordpress
          WP_VERSION: ${{ matrix.wp }}
          WC_VERSION: ${{ matrix.wc }}
        run: |
          set -euo pipefail
          command -v mysql >/dev/null || command -v mariadb >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends mariadb-client
          }
          mkdir -p /tmp/wp
          wp core download --path=/tmp/wp --version="$WP_VERSION" --force
          # NOT `wp plugin install`: that boots WordPress, so it needs a
          # wp-config.php and a database that do not exist yet.
          bash bin/install-woocommerce.sh "$WC_VERSION" /tmp/wp/wp-content/plugins
          bash bin/install-wp-tests.sh

      - name: Integration tests
        env:
          WP_ABSPATH: /tmp/wp/
          WP_TESTS_DB_HOST: 127.0.0.1
        run: composer test:integration

      - name: Integration tests (multisite)
        if: matrix.wp == '7.1' && matrix.wc == '11.0'
        env:
          WP_ABSPATH: /tmp/wp/
          WP_TESTS_DB_HOST: 127.0.0.1
          WP_TESTS_MULTISITE: '1'
        run: composer test:integration

  js:
    name: JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      # --ignore-scripts: `postinstall` runs composer install, which this job
      # has no PHP for.
      - run: npm ci --ignore-scripts
      - run: npm run lint:js
      - run: npm run lint:css
      - run: npm run test:js -- --ci
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The suite drives WordPress through wp-cli and the filesystem as well as
    # over HTTP — it seeds products, reads permalinks and writes an mu-plugin
    # into wp-content. So WordPress is installed on the runner itself, at
    # WP_PATH, rather than behind a container boundary wp-cli cannot cross.
    env:
      WP_PATH: /tmp/wp-e2e
      WP_BASE_URL: http://localhost:8888
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mysqli
          tools: composer:v2, wp-cli

      - run: npm ci --ignore-scripts
      # --no-dev, and built before provisioning: bin/install-e2e-site.sh copies
      # the plugin directory wholesale, so vendor/ and build/ have to be the
      # ones a merchant would receive by the time it runs.
      - run: composer install --no-dev --optimize-autoloader --no-progress
      - run: npm run build

      - name: Provision WordPress + WooCommerce
        run: bash bin/install-e2e-site.sh

      # PHP's built-in server is single-threaded by default, and WordPress makes
      # loopback requests to itself (REST preloads, cron spawns) — with one
      # worker those deadlock until they time out. `wp server` supplies the
      # router that maps pretty permalinks, and /wp-json/, onto index.php.
      #
      # 16, not 8: a worker that dies is NOT respawned, and the block editor —
      # the heaviest page the suite loads — cost four of them on the first run
      # that got this far, surfacing as net::ERR_EMPTY_RESPONSE. Headroom is the
      # cheap half of the fix; tests/_output/wp-server.log below is the half
      # that explains a repeat.
      - name: Start WordPress
        env:
          PHP_CLI_SERVER_WORKERS: '16'
        run: |
          set -euo pipefail
          mkdir -p tests/_output
          nohup wp server --path="$WP_PATH" --host=127.0.0.1 --port=8888 \
            > tests/_output/wp-server.log 2>&1 &
          for _ in $(seq 30); do
            if curl -sf "$WP_BASE_URL/wp-json/" >/dev/null; then
              echo "WordPress is up at $WP_BASE_URL"
              exit 0
            fi
            sleep 1
          done
          echo "::error::WordPress did not come up at $WP_BASE_URL"
          cat tests/_output/wp-server.log
          exit 1

      # GitHub runners have sudo, unlike the devcontainer, so --with-deps works.
      - run: npx playwright install --with-deps chromium

      # `npm run test:e2e` goes through dotenvx, which cannot decrypt
      # ARKID_API_KEY without .env.keys and says so loudly. That warning is
      # expected and harmless here: the suite stubs the ARkid API with an
      # mu-plugin and never calls it. dotenvx does not overwrite variables that
      # are already set, so the WP_PATH above wins over the .env default.
      - name: Playwright
        run: npm run test:e2e

      # always(), not failure(): a spec that fails and then passes on retry
      # leaves the job green and takes its trace, video and the server log with
      # it. Those are exactly the runs worth being able to look at.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: tests/_output/
          retention-days: 7
          if-no-files-found: ignore
