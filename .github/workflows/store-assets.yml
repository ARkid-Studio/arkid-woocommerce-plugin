name: Store assets

# Generates the images WordPress.org shows on the plugin page — five screenshots,
# an icon and a banner — and uploads them as one artifact.
#
# Manual, not on every push. This job loads the real 3D viewer and real cover
# images from catalogue.arkid.app, which the e2e suite deliberately never does,
# so it needs the network and must not be able to fail a pull request's checks.
# It does run on a pull request that changes the pipeline itself, which is what
# keeps the pipeline honest.
#
#   Actions → Store assets → Run workflow → download `wordpress-org-assets`.
#
# After approval, those files go into the plugin's SVN `assets/` folder.
# See tests/store-assets/README.md.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/store-assets/**'
      - 'playwright.assets.config.js'
      - '.github/workflows/store-assets.yml'

permissions:
  contents: read

concurrency:
  group: store-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    name: Screenshots, icon and banner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The same shape as the `e2e` job in ci.yml, for the same reasons: the run
    # drives WordPress through wp-cli and the filesystem as well as over HTTP,
    # so WordPress is installed on the runner itself, not behind a container.
    env:
      WP_PATH: /tmp/wp-assets
      WP_BASE_URL: http://localhost:8888
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          extensions: mysqli
          tools: composer:v2, wp-cli
          # See ci.yml: the built-in server's workers segfault inside opcache.so
          # on the block editor, and nothing here gains from opcache.
          ini-values: opcache.enable=0

      - run: npm ci --ignore-scripts
      # --no-dev and built before provisioning, as in ci.yml: the screenshots
      # must show the plugin a merchant receives, so vendor/ and build/ have to
      # be the production ones by the time install-e2e-site.sh copies them.
      - run: composer install --no-dev --optimize-autoloader --no-progress
      - run: npm run build

      - name: Provision WordPress + WooCommerce
        run: bash bin/install-e2e-site.sh

      - name: Start WordPress
        env:
          PHP_CLI_SERVER_WORKERS: '16'
        run: |
          set -euo pipefail
          mkdir -p tests/_output
          nohup wp server --path="$WP_PATH" --host=127.0.0.1 --port=8888 \
            > tests/_output/wp-server.log 2>&1 &
          for _ in $(seq 30); do
            if curl -sf "$WP_BASE_URL/wp-json/" >/dev/null; then
              echo "WordPress is up at $WP_BASE_URL"
              exit 0
            fi
            sleep 1
          done
          echo "::error::WordPress did not come up at $WP_BASE_URL"
          cat tests/_output/wp-server.log
          exit 1

      - run: npx playwright install --with-deps chromium

      - name: Screenshots
        run: npm run assets:screenshots

      - name: Icon and banner
        run: npm run assets:brand

      - name: List what was produced
        run: ls -l .wordpress-org/

      # include-hidden-files: the output folder is `.wordpress-org/` — the name
      # the WordPress.org deploy actions look for — and upload-artifact skips
      # any path with a dot-prefixed segment unless told otherwise. Without this
      # the step "succeeds" and uploads nothing, which is why the next line
      # makes an empty upload an error instead of a warning.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wordpress-org-assets
          path: .wordpress-org/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Server diagnostics
        if: failure()
        run: |
          echo '::group::wp-server.log (last 200 lines)'
          tail -n 200 tests/_output/wp-server.log || true
          echo '::endgroup::'

      # A failed shot leaves a screenshot of the page it was waiting on, which
      # is usually the whole explanation ("the viewer never drew").
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: store-assets-failure
          path: tests/_output/
          retention-days: 7
          if-no-files-found: ignore
