version: 2

# Weekly, grouped, and a week behind the registries: a freshly published
# release has to survive seven days in the wild before it is proposed here,
# which is when compromised packages tend to be caught and pulled.
updates:
  # Workflow actions are pinned to commit SHAs. This keeps those pins, and the
  # version comments beside them, current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Deliberately held on the 31.x line, the `wp-7.0` dist-tag that matches
      # our `Requires at least`: its build config decides which imports the
      # bundles make, and a newer major can emit wp-* script handles WordPress
      # 7.0 does not register. See CONTRIBUTING.md, "Deliberate pins".
      - dependency-name: '@wordpress/scripts'
        update-types: [version-update:semver-major]
      # 4.x is a flat config that needs ESLint 9+, and @wordpress/scripts 31.x
      # ships ESLint 8; 3.x still runs on it. Lift this with the scripts pin.
      - dependency-name: '@woocommerce/eslint-plugin'
        versions: ['>= 4.0.0']

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      composer-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # WordPress core's test suite supports PHPUnit 9 only, and Brain Monkey
      # and the polyfills cap there. See CONTRIBUTING.md, "Deliberate pins".
      - dependency-name: phpunit/phpunit
        update-types: [version-update:semver-major]
